services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobscore
      POSTGRES_PASSWORD: jobscore
      POSTGRES_DB: jobscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobscore:jobscore@db:5432/jobscore
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobscore:jobscore@db:5432/jobscore
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: deps
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      npm_config_cache: /tmp/.npm
      HOME: /tmp
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      # Isolate node_modules and .next from Windows host filesystem to prevent
      # ENOTEMPTY / file-locking errors on WSL2/Docker Desktop
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
